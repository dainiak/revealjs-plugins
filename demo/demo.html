<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alex Dainiak's reveal.js plugin showcase</title>
    <link rel="stylesheet" href="../reveal/dist/reset.css" />
    <link rel="stylesheet" href="../reveal/dist/reveal.css" />
    <link rel="stylesheet" href="../reveal/dist/theme/black.css" id="theme" />

    <style>
        .reveal h2 {
            margin-bottom: 0.4em;
        }
        .reveal h3 {
            margin-bottom: 0.4em;
        }
        .reveal h3 code {
            font-size: 0.85em;
            background: rgba(255, 255, 255, 0.07);
            padding: 0.05em 0.3em;
            border-radius: 4px;
        }
        .reveal .subtitle {
            font-size: 0.65em;
            opacity: 0.75;
            margin-top: -0.3em;
        }
        .reveal .footnote {
            font-size: 0.55em;
            opacity: 0.7;
            margin-top: 0.6em;
        }
        .reveal kbd {
            background: #444;
            padding: 0.1em 0.3em;
            border-radius: 3px;
            font-size: 0.85em;
        }
        .reveal .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.4em;
            align-items: start;
        }
        .reveal .two-col-narrow {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 1.4em;
            align-items: start;
        }
        .reveal pre {
            width: 100%;
            font-size: 0.46em;
        }
        .reveal pre code {
            padding: 0.4em 0.6em;
            max-height: 600px;
        }
        .reveal table {
            font-size: 0.65em;
            margin: 0.4em auto;
            border-collapse: collapse;
            min-width: 60%;
        }
        .reveal table th,
        .reveal table td {
            padding: 0.3em 0.8em;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        .reveal table th {
            font-weight: 600;
            border-bottom: 2px solid rgba(255, 255, 255, 0.4);
        }
        .reveal a.demo-link {
            display: inline-block;
            margin-top: 0.6em;
            font-size: 0.6em;
            padding: 0.3em 0.8em;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 4px;
            text-decoration: none;
        }
        .reveal a.demo-link:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .reveal ul.plugin-list {
            font-size: 0.65em;
            text-align: left;
            max-width: 75%;
            margin: 0 auto;
        }
        .reveal ul.plugin-list li {
            margin: 0.35em 0;
        }
        .reveal ul.plugin-list code {
            font-weight: 600;
        }
        .reveal div[data-vega] {
            background: #fff;
            border-radius: 4px;
            padding: 0.4em;
        }
    </style>
</head>
<body>
<div class="reveal">
    <div class="slides">
        <section data-menu-title="Moved">
            <p>The demo has moved <a href="../index.html">here</a></p>
        </section>
    </div>
</div>

<!-- reveal.js + plugins (the gateway deck loads them all) -->
<script src="../reveal/dist/reveal.js"></script>
<script>
    Reveal.initialize({
        width: 1280,
        height: 720,
        margin: 0.05,
        transition: "fade",
        hash: true,
        slideNumber: true
    });
</script>
</body>
</html>
